<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janusz Simulator 97</title>
    <base href="./" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="MakerEngine.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">ŁADOWANIE JANUSZA...</div>
    <div id="blazor-error-ui" style="background:#000;color:red;position:fixed;bottom:0;left:0;right:0;padding:10px;display:none;z-index:9999"></div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/janusz-audio.js"></script>
    <script>
        const errUi = document.getElementById('blazor-error-ui');
        Blazor.start().then(()=>{
            console.log("OK - Janusz żyje");
        }).catch(e=>{
            console.error(e);
            errUi.style.display='block';
            errUi.innerText = e.toString();
            document.body.innerHTML += "<pre style='background:red;color:white;padding:20px;position:fixed;top:0;z-index:10000;white-space:pre-wrap'>"+e+"\n"+(e.stack||'')+"</pre>";
        });
    </script>
</body>
</html>
