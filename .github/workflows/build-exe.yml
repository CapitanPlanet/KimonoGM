name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Publish engine once (CI)
        run: |
          dotnet publish engine/MakerEngine.csproj -c Release -o engine-publish -p:StaticWebAssetsCompressContent=false -p:StaticWebAssetCompressionMode=None -p:PublishTrimmed=false -p:BlazorWebAssemblyEnableTrimming=false

      - name: Build Launcher template once (CI)
        shell: pwsh
        run: |
          # Krok 5: Launcher budowany RAZ w CI, nie u uzytkownika.
          $launcherDir = "Launcher"
          New-Item -ItemType Directory -Force -Path $launcherDir | Out-Null
          if (-not (Test-Path "$launcherDir/Launcher.csproj")) {
            @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
              <IncludeAllContentForSelfExtract>true</IncludeAllContentForSelfExtract>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.2739.15" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Path "$launcherDir/Launcher.csproj" -Encoding UTF8
          }
          if (-not (Test-Path "$launcherDir/wwwroot.zip")) {
            Compress-Archive -Path "$launcherDir/Program.cs" -DestinationPath "$launcherDir/wwwroot.zip" -Force
          }
          dotnet publish "$launcherDir/Launcher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o Launcher-publish
          Copy-Item "Launcher-publish/Launcher.exe" -Destination "Launcher.exe" -Force

      - name: Prepare embedded bundle.zip for single-file editor
        shell: pwsh
        run: |
          # Pakowanie edytora - wersja ZIP. Male kroczki.
          # CI robi 1 plik bundle.zip (Launcher + engine-publish + icon.ico)
          # Go wkompilowuje tylko ten 1 plik przez //go:embed embedded/bundle.zip
          # Edytor przy pierwszym odpaleniu rozpakowuje go do %LOCALAPPDATA%/KimonoGM/
          # Uwaga: embedded/ jest w .gitignore, nie commitujemy go - CI buduje go od nowa
          New-Item -ItemType Directory -Force -Path "editor/embedded" | Out-Null
          New-Item -ItemType Directory -Force -Path "bundle-embedded" | Out-Null
          if (Test-Path "Launcher.exe") { Copy-Item "Launcher.exe" -Destination "bundle-embedded/Launcher.exe" -Force }
          if (Test-Path "engine-publish") { Copy-Item "engine-publish" -Destination "bundle-embedded/engine-publish" -Recurse -Force }
          if (Test-Path "editor/build/windows/icon.ico") { Copy-Item "editor/build/windows/icon.ico" -Destination "bundle-embedded/icon.ico" -Force }
          # Compress-Archive z -CompressionLevel Optimal - sporo mniej zajmuje niz pliki na pale
          Compress-Archive -Path "bundle-embedded/*" -DestinationPath "editor/embedded/bundle.zip" -CompressionLevel Optimal -Force
          Get-Item "editor/embedded/bundle.zip" | Select-Object Name, Length

      - name: Build Wails App (.exe) - single file with embedded bundle.zip
        run: |
          cd editor
          wails build -clean -ldflags "-H=windowsgui"

      - name: Pack legacy bundle (backup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "editor/build/bin/KimonoGM.exe" -Destination "bundle/KimonoGM.exe" -Force
          if (Test-Path "editor/build/windows/icon.ico") { Copy-Item "editor/build/windows/icon.ico" -Destination "bundle/icon.ico" -Force }
          if (Test-Path "engine-publish") { Copy-Item "engine-publish" -Destination "bundle/engine-publish" -Recurse -Force }
          if (Test-Path "Launcher.exe") { Copy-Item "Launcher.exe" -Destination "bundle/Launcher.exe" -Force }
          Compress-Archive -Path "bundle/*" -DestinationPath "KimonoGM-bundle.zip" -Force

      - name: Upload EXE as Artifact (backup)
        uses: actions/upload-artifact@v5
        with:
          name: KimonoGM-single
          path: editor/build/bin/KimonoGM.exe
          if-no-files-found: error

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            editor/build/bin/KimonoGM.exe
            KimonoGM-bundle.zip
          tag_name: v1.0.${{ github.run_number }}
          name: "KimonoGM Editor v1.0.${{ github.run_number }}"
          body: "1 plik KimonoGM.exe (edytor + bundle.zip w srodku, rozpakowuje do %LOCALAPPDATA%/KimonoGM/) + legacy KimonoGM-bundle.zip."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
