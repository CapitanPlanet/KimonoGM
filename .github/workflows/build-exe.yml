name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # === NOWE - Krok 3a: silnik budujemy RAZ, w CI, nie u użytkownika ===
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Engine (gotowy silnik, bez zrodel)
        run: |
          cd engine
          dotnet workload install wasm-tools
          dotnet publish -c Release -o ../engine-publish -p:PublishTrimmed=false -p:BlazorWebAssemblyEnableTrimming=false -p:StaticWebAssetsCompressContent=false
        shell: pwsh

      - name: Install Wails CLI
        run: go install 【entity-github¦canonical_name=GitHub】.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App (.exe)
        run: |
          cd editor
          wails build -clean -ldflags "-H=windowsgui"

      # === NOWE - paczka, nie samo exe ===
      # To naprawia sandbox: edytor dostaje gotowy silnik obok siebie
      - name: Pack bundle (exe + engine-publish)
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item editor/build/bin/KimonoGM.exe bundle/
          Copy-Item -Recurse engine-publish bundle/engine-publish
          Compress-Archive -Path bundle/* -DestinationPath KimonoGM-bundle.zip -Force
        shell: pwsh

      - name: Upload bundle as Artifact (backup)
        uses: actions/upload-artifact@v5
        with:
          name: KimonoGM-windows
          path: KimonoGM-bundle.zip
          if-no-files-found: error

      - name: Upload to 【entity-GitHub¦canonical_name=GitHub】 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: KimonoGM-bundle.zip
          tag_name: v1.0.${{ github.run_number }}
          name: "KimonoGM Editor v1.0.${{ 【entity-github¦canonical_name=GitHub】.run_number }}"
          body: "Automatyczny build desktopowego edytora prosto z gałęzi main! Paczka zawiera edytor + gotowy silnik (engine-publish). Rozpakuj CALA paczke, nie samo exe."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}