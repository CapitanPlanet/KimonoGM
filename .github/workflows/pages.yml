name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'engine-csharp/**'
      - 'engine/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install wasm-tools - TEGO CI BRAKUJE
        run: dotnet workload install wasm-tools

      - name: Publish Blazor WASM
        run: |
          if [ -d "engine-csharp" ]; then
            cd engine-csharp
          else
            cd engine
          fi
          dotnet publish -c Release -o ../publish -p:PublishTrimmed=false -p:BlazorWebAssemblyEnableTrimming=false -p:StaticWebAssetsCompressContent=false

      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/KimonoGM/" />|g' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4